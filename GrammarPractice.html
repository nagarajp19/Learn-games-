function shell(content){$("#app").innerHTML=content;$("#nav").classList.toggle("hidden",!state.user);$("#who").textContent=state.user?state.user:"Learn • Play • Improve";document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function login(){shell(`<section class="card"><h1>Grammar Practice</h1><p>Sign in to continue your learning journey.</p><div id="msg"></div><label>Username</label><input id="username" placeholder="Your username"><label>Password</label><input id="password" type="password" placeholder="Password"><button onclick="signIn()">Sign in</button><button class="secondary" onclick="register()">Create account</button><p class="muted">Demo: create an account to save your progress on this device.</p></section>`)}
function signIn(){let u=$("#username").value.trim(),p=$("#password").value;if(!u||!p){$("#msg").innerHTML='<div class="error">Please enter your username and password.</div>';return}let users=JSON.parse(localStorage.gpUsers||"{}");if(!users[u]||users[u].password!==p){$("#msg").innerHTML='<div class="error">Incorrect username or password. Please try again.</div>';return}state.user=u;state.role=users[u].role;localStorage.gpUser=u;localStorage.gpRole=state.role;go("dashboard")}
function register(){shell(`<section class="card"><h1>Create account</h1><p>Sign up to save your results and daily streak.</p><div id="msg"></div><label>Full name</label><input id="fullname" placeholder="Your full name"><label>Username</label><input id="newuser" placeholder="3–20 letters, numbers or _"><label>Email</label><input id="email" type="email" placeholder="you@example.com"><label>Password</label><input id="newpass" type="password" placeholder="At least 6 characters"><label>Confirm password</label><input id="confirm" type="password" placeholder="Type password again"><button onclick="createAccount()">Create account</button><button class="secondary" onclick="login()">Already have an account? Sign in</button></section>`)}
function createAccount(){let u=$("#newuser").value.trim(),p=$("#newpass").value,users=JSON.parse(localStorage.gpUsers||"{}");let err=[];if(!$("#fullname").value.trim())err.push("Full name is required.");if(!/^[A-Za-z0-9_]{3,20}$/.test(u))err.push("Username must be 3–20 letters, numbers or underscores.");if(!/^[^@]+@[^@]+\.[^@]+$/.test($("#email").value))err.push("Enter a valid email address.");if(p.length<6)err.push("Password must be at least 6 characters.");if(p!==$("#confirm").value)err.push("Passwords do not match.");if(users[u])err.push("Username already exists.");if(err.length){$("#msg").innerHTML='<div class="error">Please fix these problems:<br>• '+err.join("<br>• ")+'</div>';return}users[u]={password:p,role:"student",name:$("#fullname").value.trim(),email:$("#email").value};localStorage.gpUsers=JSON.stringify(users);state.user=u;state.role="student";localStorage.gpUser=u;localStorage.gpRole="student";go("dashboard")}
function dashboard(){let mine=results.filter(r=>r.user===state.user),avg=mine.length?Math.round(mine.reduce((a,b)=>a+b.score/b.total*100,0)/mine.length):0;shell(`<section class="card"><div class="topline"><div><h1>Welcome back, ${esc(state.user)}!</h1><p>Keep practising and watch your grammar grow.</p></div><span class="pill">${state.role}</span></div><div class="grid"><div class="stat"><strong>${mine.length}</strong><small>Quizzes taken</small></div><div class="stat"><strong>${avg}%</strong><small>Average score</small></div><div class="stat"><strong>${mine.reduce((a,b)=>a+b.score,0)}</strong><small>Correct answers</small></div><div class="stat"><strong>${questions.length}</strong><small>Questions available</small></div></div></section><section class="card"><h2>Daily task</h2><p>New questions are waiting for you today.</p><button onclick="startQuiz(5)">Start daily task</button></section><section class="card"><h2>Quick practice</h2><button onclick="startQuiz(10)">Start a 10-question quiz</button><button class="secondary" onclick="go('learn')">Explore grammar lessons</button></section><section class="card"><h2>Recent results</h2>${mine.slice(-3).reverse().map(r=>`<div class="tile topline"><span>${r.date}</span><b>${r.score}/${r.total}</b></div>`).join("")||'<p>No results yet. Take a quiz to see your history here.</p>'}</section>`)}
function startQuiz(n){state.replay=null;state.quiz=[...questions].filter(q=>!tenseQuestionBank.includes(q)).sort(()=>Math.random()-.5).slice(0,Math.min(n,questions.length));state.quizTitle="Mixed grammar";state.qi=0;state.score=0;state.chosen=null;state.answered=false;go("quiz")}
function startTenseQuiz(t){state.replay=null;state.quiz=tenseQuestionBank.filter(q=>q[6]===t).sort(()=>Math.random()-.5);state.quizTitle=t;state.qi=0;state.score=0;state.chosen=null;state.answered=false;go("quiz")}
function startQuizOldUnused(n){state.quiz=[...questions].sort(()=>Math.random()-.5).slice(0,Math.min(n,questions.length));state.qi=0;state.score=0;state.chosen=null;state.answered=false;go("quiz")}
function quiz(){let q=state.quiz[state.qi];if(!q){finishQuiz();return}let opts=q.slice(1,5);shell(`<section class="card"><div class="topline"><span class="pill">${esc(state.quizTitle||"Quiz")} · ${state.qi+1} of ${state.quiz.length}</span><b>Score: ${state.score}</b></div><div class="progress"><span style="width:${state.qi/state.quiz.length*100}%"></span></div><h2 style="margin-top:22px">${esc(q[0]).replace("___","<u style='text-decoration-color:#f2c94c'>______</u>")}</h2><div id="opts">${opts.map((o,i)=>`<button class="option ${state.answered&&i===q[5]?'correct':''} ${state.answered&&i===state.chosen&&i!==q[5]?'wrong':''}" ${state.answered?'disabled':''} onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join("")}</div><div id="feedback">${state.answered?feedback(q):""}</div>${state.answered?'<button onclick="nextQ()">Next question</button>':'<p class="muted">Choose the best answer.</p>'}<button class="secondary" onclick="go('dashboard')">Quit quiz</button></section>`)}
function feedback(q){return state.chosen===q[5]?'<div class="success">Correct! Great work.</div>':`<div class="error">Not quite. Correct answer: <b>${esc(q[q[5]+1])}</b></div>`}
function answer(i){if(state.answered)return;state.chosen=i;state.answered=true;if(i===state.quiz[state.qi][5])state.score++;quiz()}
function nextQ(){state.qi++;state.answered=false;state.chosen=null;quiz()}
function finishQuiz(){let r={user:state.user,score:state.score,total:state.quiz.length,date:new Date().toLocaleString()};results.push(r);save();shell(`<section class="card" style="text-align:center"><span class="pill">Quiz finished</span><h1 style="font-size:42px;margin-top:20px">${r.score} / ${r.total}</h1><h2>${Math.round(r.score/r.total*100)}% score</h2><p>${r.score===r.total?'Perfect! Excellent work.':'Well done. Keep practising to improve your score.'}</p><button onclick="go('dashboard')">Back to dashboard</button><button class="secondary" onclick="state.replay?state.replay():startQuiz(10)">Play again</button></section>`)}
const lessons=[["Present Simple","I work every day.","Habits, routines and facts. Signal words: always, usually, every day."],["Present Continuous","I am working now.","Actions happening now or around now. Signal words: now, at the moment."],["Present Perfect","I have finished my work.","Past actions connected to the present. Signal words: already, yet, ever, never."],["Present Perfect Continuous","I have been studying for two hours.","Actions that began in the past and continue now."],["Past Simple","I visited London last year.","Completed actions in the past. Signal words: yesterday, ago, last week."],["Past Continuous","I was reading at 8 pm.","An action in progress at a particular past time."],["Past Perfect","She had left before I arrived.","An action completed before another past action."],["Past Perfect Continuous","He had been waiting for an hour.","Duration before a point or event in the past."],["Future Simple","I will call you tomorrow.","Predictions, promises and decisions made now."],["Future Continuous","I will be travelling at noon.","An action that will be in progress at a future time."],["Future Perfect","They will have arrived by six.","An action completed before a future deadline."],["Future Perfect Continuous","By June, I will have been working here for a year.","Duration continuing up to a future point."]];
function learn(){shell(`<section class="card"><h1>The 12 English tenses</h1><p>Each tense has a complete set of 100 unique practice questions. Choose a tense to study its rules or start its full 100-question test.</p><input id="lessonSearch" placeholder="Search a tense..." oninput="filterLessons(this.value)"><div id="lessons">${lessonCards(lessons)}</div></section>`)}
function lessonCards(arr){return arr.map((l)=>`<details class="tile"><summary><b>${l[0]}</b> <span class="pill">100 questions</span></summary><p><b>Example:</b> ${l[1]}</p><p>${l[2]}</p><button onclick="startTenseQuiz('${l[0]}')">Start 100-question ${l[0]} test</button></details>`).join("")}
function filterLessons(v){$("#lessons").innerHTML=lessonCards(lessons.filter(l=>l[0].toLowerCase().includes(v.toLowerCase())))}
function resultsPage(){let mine=results.filter(r=>r.user===state.user).reverse();shell(`<section class="card"><h1>My results</h1><p>Your quiz history and scores.</p>${mine.map(r=>`<div class="tile topline"><div><b>${r.date}</b><br><small>${r.user}</small></div><b>${r.score}/${r.total} (${Math.round(r.score/r.total*100)}%)</b></div>`).join("")||"<p>No results yet. Complete a quiz to see it here.</p>"}</section>`)}
function admin(){if(state.role!=="admin"){shell(`<section class="card"><h1>Admin area</h1><p>Admin access is required.</p><button onclick="go('dashboard')">Back</button></section>`);return}shell(`<section class="card"><h1>Question bank</h1><p>Add, edit and remove quiz questions on this device.</p><button onclick="questionForm()">+ Add question</button><input placeholder="Search questions..." oninput="questionList(this.value)"><div id="qlist">${questionListHTML("")}</div></section>`)}
function questionList(v){$("#qlist").innerHTML=questionListHTML(v)}
function questionListHTML(v){return questions.map((q,i)=>({q,i})).filter(x=>x.q[0].toLowerCase().includes(v.toLowerCase())).map(x=>`<div class="tile"><b>${esc(x.q[0])}</b><small> • ${esc(x.q[6])}</small><div class="grid"><button class="secondary" onclick="questionForm(${x.i})">Edit</button><button class="danger" onclick="deleteQ(${x.i})">Delete</button></div></div>`).join("")}
function questionForm(i=-1){state.edit=i;let q=i>=0?questions[i]:["","","","","",0,"General"];shell(`<section class="card"><h1>${i>=0?'Edit':'Add'} question</h1><label>Question (use ___ for blank)</label><textarea id="qtext">${esc(q[0])}</textarea>${[0,1,2,3].map(j=>`<label>Option ${j+1}</label><input id="op${j}" value="${esc(q[j+1])}">`).join("")}<label>Correct answer</label><select id="correct">${[0,1,2,3].map(j=>`<option value="${j}" ${q[5]===j?'selected':''}>Option ${j+1}</option>`).join("")}</select><label>Category</label><input id="category" value="${esc(q[6])}"><button onclick="saveQ()">Save question</button><button class="secondary" onclick="go('admin')">Cancel</button></section>`)}
function saveQ(){let q=[$("#qtext").value,...[0,1,2,3].map(i=>$("#op"+i).value.trim()),Number($("#correct").value),$("#category").value.trim()||"General"];if(!q[0].trim()||q.slice(1,5).some(x=>!x)){alert("Please complete the question and all four options.");return}if(state.edit<0)questions.push(q);else questions[state.edit]=q;save();go("admin")}
function deleteQ(i){if(confirm("Delete this question?")){questions.splice(i,1);save();go("admin")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function logout(){state.user="";state.role="student";localStorage.removeItem("gpUser");localStorage.removeItem("gpRole");login()}
function render(){if(!state.user){login();return}if(state.page==="dashboard")dashboard();else if(state.page==="play")shell(`<section class="card"><h1>Start a quiz</h1><p>Choose mixed practice or one complete tense test (100 unique questions each).</p><button onclick="startQuiz(5)">5 questions · Quick mixed practice</button><button onclick="startQuiz(10)">10 questions · Standard mixed practice</button><button onclick="startQuiz(20)">20 questions · Challenge mixed practice</button></section><section class="card"><h2>Practise a specific tense</h2>${lessons.map(l=>`<div class="tile topline"><b>${l[0]}</b><button style="width:auto" onclick="startTenseQuiz('${l[0]}')">100 questions</button></div>`).join("")}</section>`);else if(state.page==="quiz")quiz();else if(state.page==="learn")learn();else if(state.page==="maths")mathsPage();else if(state.page==="puzzle")puzzlePage();else if(state.page==="results")resultsPage();else if(state.page==="admin")admin();else dashboard()}

const mathOps={add:["Addition","➕","+"],sub:["Subtraction","➖","−"],mul:["Multiplication","✖️","×"],div:["Division","➗","÷"]};
const mathLevels={easy:["Easy",[1,10]],medium:["Medium",[10,50]],hard:["Hard",[50,200]]};
state.mathLevel="easy";
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function mathQuestion(op,lv){let [lo,hi]=mathLevels[lv][1],a,b,ans;
 if(op==="add"){a=rnd(lo,hi);b=rnd(lo,hi);ans=a+b}
 else if(op==="sub"){a=rnd(lo,hi);b=rnd(lo,hi);if(b>a)[a,b]=[b,a];ans=a-b}
 else if(op==="mul"){let m=lv==="easy"?[2,10]:lv==="medium"?[2,20]:[6,30];a=rnd(m[0],m[1]);b=rnd(2,lv==="hard"?15:12);ans=a*b}
 else{b=rnd(2,lv==="easy"?10:lv==="medium"?12:20);ans=rnd(2,lv==="easy"?10:lv==="medium"?15:25);a=b*ans}
 let set=new Set([ans]),tries=0;while(set.size<4&&tries++<200){let d=rnd(1,Math.max(5,Math.round(ans*.2)))*(Math.random()<.5?-1:1),w=ans+d;if(w>=0)set.add(w)}
 let n=ans+1;while(set.size<4)set.add(n++);
 let opts=[...set].sort(()=>Math.random()-.5);
 return [`${a} ${mathOps[op][2]} ${b} = ?`,...opts.map(String),opts.indexOf(ans),mathOps[op][0]]}
function startMath(op){let lv=state.mathLevel;state.quiz=Array.from({length:10},()=>mathQuestion(op,lv));state.quizTitle=mathOps[op][0]+" · "+mathLevels[lv][0];state.qi=0;state.score=0;state.chosen=null;state.answered=false;state.replay=()=>startMath(op);go("quiz")}
function setMathLevel(v){state.mathLevel=v;go("maths")}
function mathsPage(){shell(`<section class="card"><h1>Maths practice</h1><p>Pick a level, then choose a game. Each round has 10 questions.</p><label>Difficulty</label><select onchange="setMathLevel(this.value)">${Object.entries(mathLevels).map(([k,v])=>`<option value="${k}" ${state.mathLevel===k?"selected":""}>${v[0]}</option>`).join("")}</select><div class="mgrid">${Object.entries(mathOps).map(([k,v])=>`<button class="mbtn" onclick="startMath('${k}')"><span>${v[1]}</span>${v[0]}</button>`).join("")}<button class="mbtn secondary" style="grid-column:1/-1" onclick="startPuzzle()"><span>🧩</span>Number Puzzle</button></div></section>`)}
/* Number puzzle: 3x3 sliding tiles */
function startPuzzle(){let t=[1,2,3,4,5,6,7,8,0],e=8,last=-1;for(let i=0;i<150;i++){let n=[];[[-3],[3],[-1],[1]].forEach(([d])=>{let j=e+d;if(j<0||j>8||(d===-1&&e%3===0)||(d===1&&e%3===2)||j===last)return;n.push(j)});let j=n[rnd(0,n.length-1)];[t[e],t[j]]=[t[j],t[e]];last=e;e=j}
 state.pz={t,moves:0,start:Date.now()};go("puzzle")}
function puzzlePage(){let z=state.pz,solved=z.t.every((v,i)=>v===(i<8?i+1:0));
 shell(`<section class="card"><div class="topline"><span class="pill">Number Puzzle</span><b>Moves: ${z.moves}</b></div><p>Slide the tiles to put the numbers in order from 1 to 8.</p><div class="pz">${z.t.map((v,i)=>`<button class="${v?"":"empty"}" ${solved?"disabled":""} onclick="pzMove(${i})">${v||""}</button>`).join("")}</div>${solved?`<div class="success">🎉 Solved in ${z.moves} moves and ${Math.round((Date.now()-z.start)/1000)} seconds!</div>`:""}<button onclick="startPuzzle()">${solved?"Play again":"New puzzle"}</button><button class="secondary" onclick="go('maths')">Back to Maths</button></section>`)}
function pzMove(i){let z=state.pz,e=z.t.indexOf(0),ok=(Math.abs(i-e)===3)||(Math.abs(i-e)===1&&Math.floor(i/3)===Math.floor(e/3));if(!ok)return;[z.t[i],z.t[e]]=[z.t[e],z.t[i]];z.moves++;if(z.t.every((v,k)=>v===(k<8?k+1:0))){results.push({user:state.user,score:1,total:1,date:new Date().toLocaleString()+" (Number Puzzle)"});save()}puzzlePage()}
